# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: "Test Suite and Linting"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            tox-env: py310
          - python-version: '3.11'
            tox-env: py311
          - python-version: '3.12'
            tox-env: py312
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    
    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,datasets,viz]"
    
    - name: Run tests
      run: uv run tox -e ${{ matrix.tox-env }}

  base-install:
    # Honesty check for the base install: no extras installed, so tests that
    # require pandas/matplotlib skip themselves (importorskip) and examples that
    # need them are skipped. Verifies the core surface imports without the
    # optional dependencies.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install base package and test deps
      run: |
        python -m pip install --upgrade pip
        pip install . pytest pytest-cov pytest-benchmark

    - name: Verify base import surface
      run: |
        python -c "
        import elote, sys
        leaked = [m for m in ('pandas', 'matplotlib', 'requests') if m in sys.modules]
        assert not leaked, f'base import pulled in optional deps: {leaked}'
        print('base import clean:', elote.__file__)
        "

    - name: Run tests on base install
      run: pytest tests --cov=elote --cov-report=term

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,datasets]"

    - name: Run linting
      run: |
        make lint

  # Single stable check name for branch protection; the matrix job names change
  # whenever the Python version list does.
  test:
    runs-on: ubuntu-latest
    needs: [test-matrix, lint, base-install]
    if: always()

    steps:
    - name: Check results
      run: |
        [ "${{ needs.test-matrix.result }}" = "success" ] || exit 1
        [ "${{ needs.lint.result }}" = "success" ] || exit 1
        [ "${{ needs.base-install.result }}" = "success" ] || exit 1
