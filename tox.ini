[tox]
envlist = py310, py311, py312, py313, py314, base
isolated_build = True
requires = 
    tox-uv

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312, lint
    3.13: py313
    3.14: py314

[testenv]
deps =
    pytest
    pytest-cov
    pytest-benchmark
allowlist_externals =
    uv
commands =
    uv pip install -e ".[datasets,viz]"
    pytest {posargs:tests} --cov=elote --cov-report=term

[testenv:base]
; Base-install honesty check: no extras installed, so tests that require
; pandas/matplotlib skip themselves (importorskip) and examples that need them
; are skipped.
deps =
    pytest
    pytest-cov
    pytest-benchmark
commands =
    pytest {posargs:tests} --cov=elote --cov-report=term

[testenv:lint]
deps =
    ruff
commands =
    ruff check .

[testenv:format]
deps =
    ruff
commands =
    ruff format . 